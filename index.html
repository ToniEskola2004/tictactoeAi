<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ristinolla</title>
    <link rel="stylesheet" href="style.css" type="text/css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <h1>Ristinolla</h1>
    <div class="startselection">
        <label style="font-size: 2rem" class="container">Aloita
            <input class="checkbox" id="start" type="checkbox">
            <span class="checkmark"></span>
        </label>
        <label style="font-size: 2rem" class="container">Pelaa:
            <button onclick='starGame(1)'>X:nä</button>
            <button onclick='starGame(0)'>O:na</button>
        </label>
    </div>

    <div class="game" style="display: none;">
        <div id="gameContainer">
            <div class="cell cell0" data-index="0"></div>
            <div class="cell cell1" data-index="1"></div>
            <div class="cell cell2" data-index="2"></div>
            <div class="cell cell3" data-index="3"></div>
            <div class="cell cell4" data-index="4"></div>
            <div class="cell cell5" data-index="5"></div>
            <div class="cell cell6" data-index="6"></div>
            <div class="cell cell7" data-index="7"></div>
            <div class="cell cell8" data-index="8"></div>
            <div class="scoreContainer">
                <p id="score1">X = 0</p><br>
                <p id="score2">O = 0</p>
            </div>
        </div><br>
        <button onclick="gameLogic.restart()">Aloita uudestaan</button>
        <button onclick="gameLogic.reset()">Resetoi</button>
    </div>

    <script src="js/game.js" defer></script>
    <script defer>
        let gameLogic = 0;
        function starGame(playerIndicator) {
            gameLogic = new Game(playerIndicator);
            const game = document.querySelector(".game")
            const startSelection = document.querySelector(".startselection")
            game.style.display = "block"
            startSelection.style.display = "none"
        }
    </script>
</body>

</html>
